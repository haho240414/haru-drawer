name: 하루서랍 (맥 엔진 테스트 · 안드로이드 APK · 에뮬레이터 전 과정 점검)

on:
  push:
    branches: [main, 'claude/**', 'codex/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 0.1.${{ github.run_number }}

jobs:
  engine:
    name: 맥 엔진 단위 테스트 (파서·중계·정리·잠금 카드)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  build:
    name: APK 빌드 + 네이티브 단위 테스트 (암호 호환)
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: 웹 화면 → 안드로이드 프로젝트로 복사
        run: |
          npm ci
          npx cap sync android
      - name: 서명 키 준비
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::서명 키 비밀값이 없어 서명 안 된 릴리스가 만들어집니다"
          fi
      - name: 빌드 (단위 테스트 + 릴리스 + 점검용 디버그)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release*.apk ../dist/haru-drawer.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/haru-drawer-debug.apk
          ls -la ../dist
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-report
          path: android/app/build/reports/tests
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/*.apk

  e2e:
    name: 에뮬레이터 전 과정 (안드로이드 ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: dist
      - name: 가짜 중계 서버 켜기 (에뮬레이터에서 10.0.2.2:8899)
        run: |
          nohup python tools/mock_ntfy.py --port 8899 --host 0.0.0.0 --public-url http://10.0.2.2:8899 > mock_ntfy.log 2>&1 &
          sleep 2
          curl -s http://127.0.0.1:8899/ && echo
      - name: KVM 가속 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 연결 → 공유 3종 → 맥 정리 → 폰 잠금화면
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/e2e.sh dist/haru-drawer-debug.apk e2e-out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-api${{ matrix.api }}
          path: |
            e2e-out
            mock_ntfy.log

  release:
    name: 다운로드 링크 갱신 (Releases)
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: dist
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION_NAME}" dist/haru-drawer.apk \
            --repo "${{ github.repository }}" --latest \
            --title "하루서랍 ${VERSION_NAME}" \
            --notes "안드로이드 폰에서 haru-drawer.apk 를 받아 설치하세요 ('출처를 알 수 없는 앱 설치' 허용 필요). 설치 뒤 앱 → 맥 연결 → 맥 대시보드(폰 연결)의 QR 찍기."
